    <style> #returnButton {
  display: inline-block;
  margin: 20px;
  padding: 10px 20px;

  background: white;
  color: black;

  border: 2px solid white;
  border-radius: 50px;

  font-size: 1rem;
  font-weight: 600;

  cursor: pointer;
  transition:
    background 0.25s ease,
    color 0.25s ease,
    transform 0.25s ease;

  position: relative;
  z-index: 10;
}

#returnButton:hover {
  background: black;
  color: white;
  transform: scale(1.05);
}
</style>
